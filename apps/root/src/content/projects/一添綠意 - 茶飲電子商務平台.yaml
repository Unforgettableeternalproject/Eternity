description_zh: >-
  現代化全端電商系統的演示，專注於茶飲產業的線上購物體驗。採用 React 18 + Node.js + TypeScript
  技術棧，整合完整的購物車系統、會員管理、訂單追蹤與茶飲客製化功能（甜度/冰量/配料選擇），使用 Prisma ORM + MySQL 資料庫。
title_en: A Drop Of Greenery - Tea E-commerce Platform
title_zh: 一添綠意 - 茶飲電子商務平台
description_en: >-
  A modern full-stack e-commerce system showcase focused on the online shopping
  experience for the tea beverage industry. Using React 18 + Node.js +
  TypeScript tech stack, integrating complete shopping cart system, member
  management, order tracking, and tea customization features (sweetness/ice
  level/topping selection), with Prisma ORM + MySQL database.
