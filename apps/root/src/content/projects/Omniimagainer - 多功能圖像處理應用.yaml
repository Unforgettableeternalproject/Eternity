description_zh: >-
  整合圖片格式轉換、特效處理（模糊、銳化、邊緣檢測）、雲端儲存與郵件發送的 Python Tkinter 桌面應用，支援 Google Drive OAuth
  2.0 認證上傳與即時預覽功能。
title_en: Omniimagainer - Multi-Purpose Image Processing Application
