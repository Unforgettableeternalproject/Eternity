description_zh: >-
  基於 Microsoft Azure Face API 的桌面人臉辨識應用程式，透過 Python Tkinter 提供圖形化介面，整合 OpenCV
  攝影機擷取、人臉偵測、人臉辨識與訓練功能，支援 PersonGroup 分組管理機制。
title_en: FacePI - Azure Face Recognition Application
title_zh: FacePI - Azure 人臉辨識應用
description_en: >-
  A desktop face recognition application based on Microsoft Azure Face API,
  providing a graphical interface through Python Tkinter and integrating OpenCV
  camera capture, face detection, face identification, and training
  functionalities, supporting PersonGroup grouping management mechanism.
