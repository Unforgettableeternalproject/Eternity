name: Deploy Workers

on:
  push:
    branches: [main, staging]
    paths:
      - 'workers/**'

jobs:
  detect-changes:
    name: Detect Changed Workers
    runs-on: ubuntu-latest
    outputs:
      content-api: ${{ steps.filter.outputs.content-api }}
      visitor-counter: ${{ steps.filter.outputs.visitor-counter }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            content-api:
              - 'workers/content-api/**'
            visitor-counter:
              - 'workers/visitor-counter/**'

  # 部署一律用 workspace 安裝的 wrangler：wrangler-action 在沒有 node_modules 時
  # 會改用 npm 在 pnpm monorepo 裡安裝舊版 wrangler，npm 會直接崩潰。
  deploy-content-api:
    name: Deploy Content API
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.content-api == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter content-api-worker...

      - name: Deploy to Cloudflare Workers
        run: pnpm --filter content-api-worker exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-visitor-counter:
    name: Deploy Visitor Counter
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.visitor-counter == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter visitor-counter-worker...

      - name: Deploy to Cloudflare Workers
        run: pnpm --filter visitor-counter-worker exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
