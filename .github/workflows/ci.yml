name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

jobs:
  ci:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        # PR 時必須通過，普通 commit 可以暫時跳過
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Type check
        run: pnpm typecheck
        # PR 時必須通過，普通 commit 可以暫時跳過
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Format check
        run: pnpm format:check
        # PR 時必須通過，普通 commit 可以暫時跳過
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Build
        run: pnpm build

  # Develop 分支：版本變動時打 tag
  tag-develop:
    name: Tag Development Version
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_version=v$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if version changed
        id: version_changed
        run: |
          # 檢查上一次提交的版本
          git checkout HEAD~1 -- package.json 2>/dev/null || true
          PREV_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
          git checkout HEAD -- package.json

          CURR_VERSION="${{ steps.get_version.outputs.version }}"
          echo "Previous version: $PREV_VERSION"
          echo "Current version: $CURR_VERSION"

          if [ "$PREV_VERSION" != "$CURR_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed from $PREV_VERSION to $CURR_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version not changed"
          fi

      - name: Check if tag exists
        if: steps.version_changed.outputs.changed == 'true'
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.get_version.outputs.tag_version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.tag_version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.tag_version }} does not exist"
          fi

      - name: Create and push development tag
        if: steps.version_changed.outputs.changed == 'true' && steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.get_version.outputs.tag_version }} -m "Development version ${{ steps.get_version.outputs.tag_version }}"
          git push origin ${{ steps.get_version.outputs.tag_version }}
          echo "✅ Created development tag: ${{ steps.get_version.outputs.tag_version }}"

  # Main 分支：release/hotfix 合併時打 stable/hotfix tag
  tag-production:
    name: Tag Production Release
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect merge type and version
        id: detect_merge
        run: |
          # 取得 squash commit 的第一行（即 PR 標題）
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $COMMIT_MSG"

          # 檢測 Release: "Release version vX.Y.Z deploy to main. MM/DD"
          if echo "$COMMIT_MSG" | grep -qE "Release version v[0-9]+\.[0-9]+\.[0-9]+ deploy to main"; then
            BRANCH_TYPE="release"
            VERSION=$(echo "$COMMIT_MSG" | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" | head -1 | sed 's/^v//')
            echo "Detected Release: v$VERSION"

          # 檢測 Hotfix: "Hotfix vX.Y.Z batch #N: <描述>. MM/DD"
          elif echo "$COMMIT_MSG" | grep -qE "Hotfix v[0-9]+\.[0-9]+\.[0-9]+ batch #[0-9]+"; then
            BRANCH_TYPE="hotfix"
            VERSION=$(echo "$COMMIT_MSG" | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" | head -1 | sed 's/^v//')
            BATCH_NUM=$(echo "$COMMIT_MSG" | grep -oE "batch #[0-9]+" | grep -oE "[0-9]+")
            echo "Detected Hotfix: v$VERSION batch #$BATCH_NUM"
            echo "hotfix_batch=$BATCH_NUM" >> $GITHUB_OUTPUT

          else
            echo "Not a release or hotfix merge, skipping tagging"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "branch_type=$BRANCH_TYPE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 驗證版本號與 package.json 一致
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "⚠️  Warning: Commit message version ($VERSION) differs from package.json ($PKG_VERSION)"
            echo "Using commit message version: $VERSION"
          fi

      - name: Calculate tag suffix
        if: steps.detect_merge.outputs.skip != 'true'
        id: calc_suffix
        run: |
          VERSION="${{ steps.detect_merge.outputs.version }}"
          BRANCH_TYPE="${{ steps.detect_merge.outputs.branch_type }}"

          if [ "$BRANCH_TYPE" = "release" ]; then
            # Release: 添加 -stable 後綴
            TAG_NAME="v${VERSION}-stable"
            echo "suffix=stable" >> $GITHUB_OUTPUT
          elif [ "$BRANCH_TYPE" = "hotfix" ]; then
            # Hotfix: 使用 commit message 中的 batch number
            BATCH_NUM="${{ steps.detect_merge.outputs.hotfix_batch }}"
            TAG_NAME="v${VERSION}-hotfix${BATCH_NUM}"
            echo "suffix=hotfix${BATCH_NUM}" >> $GITHUB_OUTPUT
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Calculated tag: $TAG_NAME"

      - name: Create and push production tag
        if: steps.detect_merge.outputs.skip != 'true'
        run: |
          TAG_NAME="${{ steps.calc_suffix.outputs.tag_name }}"
          BRANCH_TYPE="${{ steps.detect_merge.outputs.branch_type }}"
          VERSION="${{ steps.detect_merge.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$BRANCH_TYPE" = "release" ]; then
            git tag -a "$TAG_NAME" -m "🚀 Stable Release $VERSION"
          else
            git tag -a "$TAG_NAME" -m "🔥 Hotfix Release $VERSION"
          fi

          git push origin "$TAG_NAME"
          echo "✅ Created production tag: $TAG_NAME"

      - name: Sync back to develop
        if: steps.detect_merge.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_TYPE="${{ steps.detect_merge.outputs.branch_type }}"
          VERSION="${{ steps.detect_merge.outputs.version }}"

          # 1. 回推 develop（release + hotfix 都做）
          git fetch origin develop
          git checkout develop
          git merge origin/main -m "chore: sync from main after ${BRANCH_TYPE} v${VERSION} [skip ci]"
          git push origin develop
          echo "✅ Synced changes back to develop"

      - name: Sync back to staging (release only)
        if: steps.detect_merge.outputs.skip != 'true' && steps.detect_merge.outputs.branch_type == 'release'
        run: |
          # Release 後 staging 直接對齊 main
          git push origin main:staging --force
          echo "✅ Force-reset staging to match main"

      - name: Create GitHub Release
        if: steps.detect_merge.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.calc_suffix.outputs.tag_name }}
          name: Release ${{ steps.detect_merge.outputs.version }} (${{ steps.calc_suffix.outputs.suffix }})
          body: |
            ## 🚀 Production Release ${{ steps.detect_merge.outputs.version }}

            **Type**: ${{ steps.detect_merge.outputs.branch_type }}
            **Tag**: ${{ steps.calc_suffix.outputs.tag_name }}

            ### Deployments
            - 🌟 Main Site: https://unforgettableeternalproject.com
            - 🧪 Preview: https://eternity-8v7.pages.dev
            - 📚 Docs Site: https://uep.unforgettableeternalproject.com

            See [CHANGELOG.md](CHANGELOG.md) for detailed changes.
          draft: false
          prerelease: ${{ steps.detect_merge.outputs.branch_type == 'hotfix' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
