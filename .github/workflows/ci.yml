name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

jobs:
  ci:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/*/dist

  auto-tag:
    name: Update Version & Create Release Tag
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from latest merged PR branch
        id: extract_version
        run: |
          # 取得最新的 commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          
          # 嘗試從 commit message 中提取分支名稱（GitHub 自動合併的格式）
          # 格式: "Merge pull request #X from user/release/vX.X.X"
          BRANCH_NAME=$(echo "$COMMIT_MSG" | grep -oP 'from [^/]+/\K.*' | head -1)
          
          if [ -z "$BRANCH_NAME" ]; then
            echo "No release branch found in commit message, using package.json version"
            VERSION=$(node -p "require('./package.json').version")
          else
            echo "Found branch: $BRANCH_NAME"
            # 從分支名稱提取版本號 (release/v0.1.0-rc001 -> 0.1.0-rc001)
            VERSION=$(echo "$BRANCH_NAME" | sed -E 's/^release\/v?//')
            echo "Extracted version from branch: $VERSION"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_version=v$VERSION" >> $GITHUB_OUTPUT
          echo "Final version: $VERSION (tag: v$VERSION)"

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Update package.json versions
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          echo "Updating all package.json files to version $VERSION"
          
          # 更新 root package.json
          node -e "const pkg=require('./package.json'); pkg.version='$VERSION'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n')"
          
          # 更新 apps/root/package.json
          node -e "const pkg=require('./apps/root/package.json'); pkg.version='$VERSION'; require('fs').writeFileSync('./apps/root/package.json', JSON.stringify(pkg, null, 2) + '\n')"
          
          # 更新 apps/uep/package.json
          node -e "const pkg=require('./apps/uep/package.json'); pkg.version='$VERSION'; require('fs').writeFileSync('./apps/uep/package.json', JSON.stringify(pkg, null, 2) + '\n')"
          
          # 更新 packages/config/package.json
          node -e "const pkg=require('./packages/config/package.json'); pkg.version='$VERSION'; require('fs').writeFileSync('./packages/config/package.json', JSON.stringify(pkg, null, 2) + '\n')"
          
          # 更新 packages/ui/package.json
          node -e "const pkg=require('./packages/ui/package.json'); pkg.version='$VERSION'; require('fs').writeFileSync('./packages/ui/package.json', JSON.stringify(pkg, null, 2) + '\n')"

      - name: Format updated files
        run: |
          pnpm install --frozen-lockfile
          pnpm format

      - name: Commit version updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bump version to ${{ steps.extract_version.outputs.version }} [skip ci]"
            git push origin main
          fi

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.extract_version.outputs.tag_version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.extract_version.outputs.tag_version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.extract_version.outputs.tag_version }} does not exist"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.extract_version.outputs.tag_version }} -m "Release ${{ steps.extract_version.outputs.tag_version }}"
          git push origin ${{ steps.extract_version.outputs.tag_version }}

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.extract_version.outputs.tag_version }}
          release_name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## 🚀 Release ${{ steps.get_version.outputs.version }}

            ### Changes
            Automatically generated release from main branch.

            ### Deployments
            - 🌟 Main Site: https://unforgettableeternalproject.com
            - 📚 Docs Site: https://uep.unforgettableeternalproject.com

            See [CHANGELOG.md](CHANGELOG.md) for detailed changes.
          draft: false
          prerelease: false
          retention-days: 7
