name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

jobs:
  ci:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Type check
        run: pnpm typecheck
        continue-on-error: true

      - name: Format check
        run: pnpm format:check
        continue-on-error: true

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/*/dist

  # Develop 分支：版本變動時打 tag
  tag-develop:
    name: Tag Development Version
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_version=v$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if version changed
        id: version_changed
        run: |
          # 檢查上一次提交的版本
          git checkout HEAD~1 -- package.json 2>/dev/null || true
          PREV_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
          git checkout HEAD -- package.json
          
          CURR_VERSION="${{ steps.get_version.outputs.version }}"
          echo "Previous version: $PREV_VERSION"
          echo "Current version: $CURR_VERSION"
          
          if [ "$PREV_VERSION" != "$CURR_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed from $PREV_VERSION to $CURR_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version not changed"
          fi

      - name: Check if tag exists
        if: steps.version_changed.outputs.changed == 'true'
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.get_version.outputs.tag_version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.tag_version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.tag_version }} does not exist"
          fi

      - name: Create and push development tag
        if: steps.version_changed.outputs.changed == 'true' && steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.get_version.outputs.tag_version }} -m "Development version ${{ steps.get_version.outputs.tag_version }}"
          git push origin ${{ steps.get_version.outputs.tag_version }}
          echo "✅ Created development tag: ${{ steps.get_version.outputs.tag_version }}"

  # Main 分支：release/hotfix 合併時打 stable/hotfix tag
  tag-production:
    name: Tag Production Release
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect merge type and version
        id: detect_merge
        run: |
          # 取得最新的 commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # 檢測分支類型
          if echo "$COMMIT_MSG" | grep -q "from [^/]*/release/"; then
            BRANCH_TYPE="release"
            BRANCH_NAME=$(echo "$COMMIT_MSG" | grep -oP 'from [^/]+/release/\K.*' | head -1)
          elif echo "$COMMIT_MSG" | grep -q "from [^/]*/hotfix/"; then
            BRANCH_TYPE="hotfix"
            BRANCH_NAME=$(echo "$COMMIT_MSG" | grep -oP 'from [^/]+/hotfix/\K.*' | head -1)
          else
            echo "Not a release or hotfix merge, skipping tagging"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "branch_type=$BRANCH_TYPE" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # 從 package.json 獲取版本號
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected: $BRANCH_TYPE merge, version: $VERSION"

      - name: Calculate tag suffix
        if: steps.detect_merge.outputs.skip != 'true'
        id: calc_suffix
        run: |
          VERSION="${{ steps.detect_merge.outputs.version }}"
          BRANCH_TYPE="${{ steps.detect_merge.outputs.branch_type }}"

          if [ "$BRANCH_TYPE" = "release" ]; then
            # Release: 添加 -stable 後綴
            TAG_NAME="v${VERSION}-stable"
            echo "suffix=stable" >> $GITHUB_OUTPUT
          elif [ "$BRANCH_TYPE" = "hotfix" ]; then
            # Hotfix: 計算該版本的 hotfix 次數
            # 列出所有該版本的 hotfix tags
            HOTFIX_COUNT=$(git tag -l "v${VERSION}-hotfix*" | wc -l)
            NEXT_HOTFIX=$((HOTFIX_COUNT + 1))
            TAG_NAME="v${VERSION}-hotfix${NEXT_HOTFIX}"
            echo "suffix=hotfix${NEXT_HOTFIX}" >> $GITHUB_OUTPUT
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Calculated tag: $TAG_NAME"

      - name: Create and push production tag
        if: steps.detect_merge.outputs.skip != 'true'
        run: |
          TAG_NAME="${{ steps.calc_suffix.outputs.tag_name }}"
          BRANCH_TYPE="${{ steps.detect_merge.outputs.branch_type }}"
          VERSION="${{ steps.detect_merge.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ "$BRANCH_TYPE" = "release" ]; then
            git tag -a "$TAG_NAME" -m "🚀 Stable Release $VERSION"
          else
            git tag -a "$TAG_NAME" -m "🔥 Hotfix Release $VERSION"
          fi
          
          git push origin "$TAG_NAME"
          echo "✅ Created production tag: $TAG_NAME"

      - name: Sync back to develop
        if: steps.detect_merge.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 切換到 develop 分支
          git fetch origin develop
          git checkout develop
          
          # 合併 main 的變更
          git merge origin/main -m "chore: sync from main after production release [skip ci]"
          
          # 推送回 develop
          git push origin develop
          echo "✅ Synced changes back to develop"

      - name: Create GitHub Release
        if: steps.detect_merge.outputs.skip != 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.calc_suffix.outputs.tag_name }}
          release_name: Release ${{ steps.detect_merge.outputs.version }} (${{ steps.calc_suffix.outputs.suffix }})
          body: |
            ## 🚀 Production Release ${{ steps.detect_merge.outputs.version }}
            
            **Type**: ${{ steps.detect_merge.outputs.branch_type }}
            **Tag**: ${{ steps.calc_suffix.outputs.tag_name }}

            ### Deployments
            - 🌟 Main Site: https://unforgettableeternalproject.com
            - 🧪 Preview: https://eternity-8v7.pages.dev
            - 📚 Docs Site: https://uep.unforgettableeternalproject.com

            See [CHANGELOG.md](CHANGELOG.md) for detailed changes.
          draft: false
          prerelease: ${{ steps.detect_merge.outputs.branch_type == 'hotfix' }}
          retention-days: 7
