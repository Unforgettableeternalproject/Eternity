<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UEP</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
           margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f19; color: #e7e9ee; }
    .card { width: min(720px, 92vw); padding: 28px; border: 1px solid rgba(255,255,255,.12);
            border-radius: 18px; background: rgba(255,255,255,.04); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: .5px; }
    p  { margin: 0 0 14px; opacity: .85; line-height: 1.6; }
    code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 8px; }
    a { color: #9ad0ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .row { display:flex; gap:10px; flex-wrap:wrap; margin-top: 10px; }
    .pill { border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 8px 12px; font-size: 13px; opacity: .9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>UEP</h1>
    <p>這裡是 <code>unforgettableeternalproject.com</code> 的暫時首頁。</p>
    <p>先把網站掛起來，後續再逐步補上內容、文件與功能。</p>
    <div class="row">
      <div class="pill">Status: Online</div>
      <div class="pill">Phase: Bootstrap</div>
      <div class="pill">Next: Docs + Slug routing</div>
    </div>
    <p style="margin-top:16px; font-size: 13px; opacity:.7;">
      Powered by Cloudflare Pages
    </p>
  </div>
</body>
</html>
